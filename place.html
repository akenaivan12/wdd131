<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Japan</title>

    <link rel="stylesheet" href="css/place.css" />
    <script src="js/place.js" defer></script>
</head>
<body>

<header>
    <h1>Japan</h1>
</header>

<main>

    <!-- HERO SECTION -->
    <section class="hero">
        <picture>
            <source srcset="images/hero-large.webp" media="(min-width: 900px)">
            <source srcset="images/hero-medium.webp" media="(min-width: 600px)">
            <img src="images/japan.webp" alt="Scenic view of Japan">
        </picture>

        <div class="hero-label">
            <h2>Discover the Land of the Rising Sun</h2>
        </div>
    </section>

    <!-- WEATHER + DATA SECTION -->
    <section class="info-grid">

        <!-- WEATHER CARD -->
        <div class="card weather">
            <h2 class="weather-title">Weather</h2>

            <!-- Mobile SVG Weather Icon -->
            <img class="weather-icon-mobile" src="images/weather.svg" alt="Weather icon">

            <p><strong>Temperature:</strong> <span id="temp">7</span> °C</p>
            <p><strong>Wind Speed:</strong> <span id="wind">12</span> km/h</p>
            <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>
        </div>

        <!-- DATA CARD -->
        <div class="card data">
            <h2>About Japan</h2>
            <ul>
                <li>Capital: Tokyo</li>
                <li>Population: 125 million</li>
                <li>Famous for: Cherry blossoms, temples, technology</li>
                <li>Region: East Asia</li>
            </ul>
        </div>

    </section>

</main>

<footer>
    <p>&copy; <span id="currentyear"></span> Japan Travel Showcase</p>
    <p>Last Modified: <span id="lastmodified"></span></p>
</footer>

</body>
</html>
