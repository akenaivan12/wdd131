<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Review Form</title>
  <link rel="stylesheet" href="css/form.css" />
  <script src="js/products.js" defer></script>
</head>
<body>
  <main>
    <h1>Product Review Form</h1>
    <form method="get" action="review.html">
      <!-- Product Name -->
      <label for="product">Product Name</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <!-- Rating -->
      <label>Overall Rating</label>
      <div class="rating">
        <label><input type="radio" name="rating" value="1" required> ☆</label>
        <label><input type="radio" name="rating" value="2"> ☆☆</label>
        <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
        <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
        <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
      </div>

      <!-- Date Installed -->
      <label for="install">Date of Installation</label>
      <input type="date" id="install" name="install" required>

      <!-- Useful Features -->
      <fieldset>
        <legend>Useful Features (Check all that apply)</legend>
        <label><input type="checkbox" id="feature1" name="features" value="durable"> Durable</label>
        <label><input type="checkbox" id="feature2" name="features" value="easy"> Easy to Use</label>
        <label><input type="checkbox" id="feature3" name="features" value="light"> Lightweight</label>
        <label><input type="checkbox" id="feature4" name="features" value="fast"> Fast Performance</label>
      </fieldset>

      <!-- Written Review -->
      <label for="review">Written Review (Optional)</label>
      <textarea id="review" name="review" rows="5"></textarea>

      <!-- User Name -->
      <label for="username">Your Name (Optional)</label>
      <input type="text" id="username" name="username">

      <input type="submit" value="Submit Review">
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Product Reviews | WDD131</p>
  </footer>
</body>
</html>
