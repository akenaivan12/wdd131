<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Submit a product review including rating, installation date, useful features, and written feedback for various products.">
  <meta name="author" content="Akena Ivan">
  <title>Product Review Form</title>
  <link rel="stylesheet" href="css/form.css">
  <script src="js/products.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review Form</h1>
  </header>
  <main>
    <form method="get" action="review.html">
      <!-- Product Name -->
      <label for="product">Product Name</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <!-- Rating -->
      <label for="rating1">Overall Rating</label>
      <div class="rating">
        <input type="radio" id="rating1" name="rating" value="1" required>
        <label for="rating1">☆</label>
        <input type="radio" id="rating2" name="rating" value="2" required>
        <label for="rating2">☆☆</label>
        <input type="radio" id="rating3" name="rating" value="3" required>
        <label for="rating3">☆☆☆</label>
        <input type="radio" id="rating4" name="rating" value="4" required>
        <label for="rating4">☆☆☆☆</label>
        <input type="radio" id="rating5" name="rating" value="5" required>
        <label for="rating5">☆☆☆☆☆</label>
      </div>

      <!-- Date Installed -->
      <label for="install">Date of Installation</label>
      <input type="date" id="install" name="install" required>

      <!-- Useful Features -->
      <fieldset>
        <legend>Useful Features (Check all that apply)</legend>
        <input type="checkbox" id="feature1" name="features" value="durable">
        <label for="feature1">Durable</label>
        <input type="checkbox" id="feature2" name="features" value="easy">
        <label for="feature2">Easy to Use</label>
        <input type="checkbox" id="feature3" name="features" value="light">
        <label for="feature3">Lightweight</label>
        <input type="checkbox" id="feature4" name="features" value="fast">
        <label for="feature4">Fast Performance</label>
      </fieldset>

      <!-- Written Review -->
      <label for="review">Written Review (Optional)</label>
      <textarea id="review" name="review" rows="5"></textarea>

      <!-- User Name -->
      <label for="username">Your Name (Optional)</label>
      <input type="text" id="username" name="username">

      <input type="submit" value="Submit Review">
    </form>
  </main>
  <footer>
    <p>&copy; 2025 Product Reviews | WDD131</p>
  </footer>
</body>
</html>
